name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

env:
  # Published in the README: a release signed with any other key fails here instead of breaking updates.
  CERT_SHA256: 6ead00d42a19cf1ea2303ada7255153012c0a84d426a1bee0a6c785037e060e2

jobs:
  # No secret and a read-only token here: build plugins and dependencies never see the signing key.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # versionCode is the commit count and is checked against the other release tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          code="$(git rev-list --count HEAD)"
          # Android refuses an update with a lower versionCode.
          max="$(git tag -l 'v*' | xargs -r -n1 git rev-list --count | sort -n | tail -1)"
          [ "$code" -ge "${max:-0}" ] || { echo "::error::versionCode $code is below the highest release tag ($max)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew test check assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          # Lets the publish job alone be re-run on the same binary.
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      APK: tc001-mini-${{ needs.build.outputs.version }}.apk
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-release-unsigned

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.TC001_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TC001_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TC001_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64" -a -n "$KEYSTORE_PASSWORD" -a -n "$KEY_ALIAS" || { echo "::error::signing secrets missing"; exit 1; }
          tools="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$tools/apksigner" || { echo "::error::build-tools 36.0.0 missing on the runner"; exit 1; }
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          "$tools/zipalign" -f 4 app-release-unsigned.apk aligned.apk
          # Passwords come from the environment: nothing on the command line or on disk.
          "$tools/apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "$APK" aligned.apk
          "$tools/apksigner" verify --print-certs "$APK" | grep -qi "SHA-256 digest: $CERT_SHA256" \
            || { echo "::error::$APK is not signed with the published certificate"; exit 1; }

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.APK }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          # Re-runnable: a release created by a failed earlier attempt only gets its asset replaced.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
          fi
